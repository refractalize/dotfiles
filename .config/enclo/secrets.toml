[store.cache]
idle_ttl = "10m"
max_ttl  = "1h"

[store.confirm]
enabled     = true
debounce_ms = 50

[[store.routes]]
patterns = ["GITHUB_TOKEN", "GH_TOKEN"]
backend  = "github"

[[store.routes]]
patterns = [
  "AWS_CREDENTIALS?profile=sem-automation-readonly-*",
]
backend  = "aws-vault"

[[store.routes]]
patterns = ["AWS_CREDENTIALS"]
backend  = "aws-vault"
cache = false

# Uses the default cache settings from [store.cache].
[[store.routes]]
patterns = ["*"]
backend  = "pass"

[[store.backends]]
name = "pass"

[[store.backends]]
name = "github"

[[store.backends]]
name = "aws-vault"

# Access control for the Unix socket secrets service.
[secrets.access]
mode  = "deny-all"
allow = ["GITHUB_TOKEN", "GH_TOKEN", "AWS_CREDENTIALS", "CLAUDE_CODE_OAUTH_TOKEN"]

# HTTPS MITM proxy.
[proxy]
enabled = true
listen  = "127.0.0.1:10080"

[proxy.tls]
ca_cert = "certs/ca.crt"
ca_key  = "certs/ca.key"

# Inject a bearer token for the GitHub API.
# Requires: pass show GITHUB_TOKEN
[[proxy.rules]]
domain = "api.github.com"
auth   = { type = "bearer", secret = "GITHUB_TOKEN" }

# Inject a bearer token for the Anthropic API.
# Requires: pass show CLAUDE_CODE_OAUTH_TOKEN
[[proxy.rules]]
domain = "api.anthropic.com"
auth   = { type = "bearer", secret = "CLAUDE_CODE_OAUTH_TOKEN" }

# Inject basic auth for git-over-HTTPS.
# Username is literal; password comes from pass.
# Requires: pass show GITHUB_TOKEN
[[proxy.rules]]
domain = "github.com"
auth   = { type = "basic", username = "git", secret = "GITHUB_TOKEN" }

# Raw file and archive downloads.
# Requires: pass show GITHUB_TOKEN
[[proxy.rules]]
domain = "raw.githubusercontent.com"
auth   = { type = "bearer", secret = "GITHUB_TOKEN" }
